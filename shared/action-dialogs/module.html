<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Action Dialogs Module</title>
  <link rel="stylesheet" href="./module.css">
</head>
<body>
  <main class="action-dialog-demo" data-module="action-dialogs" data-action-dialog-demo>
    <h1>Action Dialogs</h1>
    <p>Standalone preview for the shared alert and confirm APIs.</p>
    <div class="action-dialog-demo-actions" aria-label="Dialog previews">
      <button type="button" data-demo-alert>Open alert</button>
      <button type="button" data-demo-confirm>Open confirm</button>
    </div>
    <p class="action-dialog-demo-result" data-action-dialog-result aria-live="polite"></p>
  </main>
  <script src="./module.js"></script>
</body>
</html>
