      // 在頁面關閉前盡力送出（最佳努力）
      window.addEventListener('beforeunload', () => {
        if (pendingSave) {
          navigator.sendBeacon('/calendar', new Blob([JSON.stringify(dayTasks)], { type: 'application/json' }));
        }
      });
      // 渲染某一天的任務清單（僅產生 DOM；不在此綁任何 per-row 事件）
      function renderTaskList(li, dateKey, opts = {}) {
        const listEl = li.querySelector('.task-list');
        if (!listEl) return;

        // 1) 取資料 + 清空容器
        const arr = getList(dateKey); // e.g. [{id, text}, ...]
        listEl.textContent = '';      // 比 innerHTML 更快、更安全

        // 3) 用 fragment 批量插入，減少重排/重繪
        const frag = document.createDocumentFragment();

        for (let i = 0; i < arr.length; i++) {
          const item = arr[i];
          // console.log(item)

          const row = document.createElement('div');
          row.className = 'task-item';
          row.dataset.id = item.id;
          if (opts.selectedId && item.id === opts.selectedId) {
            row.classList.add('selected');
          }

          // —— 拖曳把手（交由容器事件委派 mousedown/up 控制 draggable）——
          const drag = document.createElement('div');
          drag.className = 'icon-btn drag-handle';
          drag.innerHTML = SORT_SVG;
          drag.setAttribute('aria-label', '拖曳排序');

          // —— 文字輸入（交由容器事件委派 input/keydown 處理資料）——
          const input = document.createElement('div');
          input.className = 'task-text';
          input.textContent = item.text || '';

          const show_start_time = document.createElement('div');
          show_start_time.className = 'task-text time';
          show_start_time.textContent = item.start_time || '';

          // const input = document.createElement('input');
          // input.type = 'text';
          // input.value = item.text || '';
          // input.placeholder = '新增事項…';
          // input.autocomplete = 'off';
          // input.spellcheck = false;
          // input.inputMode = 'text';

          // // —— 刪除按鈕（交由容器事件委派 click 處理刪除）——
          // const del = document.createElement('div');
          // del.className = 'icon-btn task-del';
          // del.innerHTML = TRASH_SVG;
          // del.title = '刪除';
          // del.setAttribute('role', 'button');
          // del.tabIndex = 0;

          row.appendChild(drag);
          row.appendChild(input);
          row.appendChild(show_start_time);
          // row.appendChild(del);

          frag.appendChild(row);
        }

        listEl.appendChild(frag);

        // 4) 選擇性：渲染完後自動聚焦某一列的 input
        if (opts.autoFocusId) {
          li.querySelector(`.task-item[data-id="${opts.autoFocusId}"] input`)?.focus();
        }
      }

      // 給某一天的某一筆 item 安排 start_time / end_time
      // 規則：
      //  1. 找出同一天 list 其他任務的最晚 end_time
      //  2. 若最晚 end_time > 17:30 → 固定 16:30~17:30
      //  3. 否則 → start = 最晚 end_time, end = 最晚 end_time + 60 分鐘
      //  4. 若當天沒有任何 end_time → 用預設 08:00~09:00（你可改）
      function assignTimeForItem(list, item) {
        const clamp1730 = hmToMin('17:30');
        let latestEndMin = -Infinity;

        for (const it of list) {
          if (it === item) continue;           // 不要算到自己
          const endMin = hmToMin(it?.end_time);
          if (endMin != null && endMin > latestEndMin) {
            latestEndMin = endMin;
          }
        }

        let startMin, endMin;

        if (latestEndMin === -Infinity) {
          // 尚無任何任務有 end_time
          startMin = hmToMin('08:00');        // 可改預設起點
          endMin   = startMin + 60;
        } else if (latestEndMin > clamp1730) {
          // 最晚的 end_time 已經超過 17:30
          startMin = hmToMin('16:30');
          endMin   = hmToMin('17:30');
        } else {
          // 其餘 → 接在最後一筆後面 60 分
          startMin = latestEndMin;
          endMin   = latestEndMin + 60;
        }

        item.start_time = minToHm(startMin);
        item.end_time   = minToHm(endMin);
      }

      /* 計算拖曳時，應該插到哪一個元素之前 */
      function getDragAfterElement(container, mouseY) { // container為.task-list
        // 這行會拿到「除了正在移動的那個項目以外」的所有項目
        const els = [...container.querySelectorAll('.task-item:not(.dragging)')];
        // console.log(els) //[div.task-item, div.task-item]
        // 一開始給它 Number.NEGATIVE_INFINITY(負無限大), 意思是「目前還沒有找到任何候選元素」
        let closest = { offset: Number.NEGATIVE_INFINITY, element: null };
        // 用這些項目的位置（getBoundingClientRect()）去判斷目前該把.dragging插到哪裡
        els.forEach(el => {
          const box = el.getBoundingClientRect();
          const offset = mouseY - (box.top + box.height / 2);
          // offset < 0：滑鼠在這個元素的中線「上方」。
          // offset > closest.offset：比目前記錄的更接近滑鼠。
          if (offset < 0 && offset > closest.offset) {
            closest = { offset, element: el };
          }
        });
        // 整個清單跑完後，closest.element 會是滑鼠下方最近的元素
        // 找到的那個「應該插在它前面的元素」；若沒有找到（代表滑鼠在最底部），就回傳 null。
        // 回傳整個task-item元素 e.g. <div class="task-item" data-id="tmh2...">...</div>
        //console.log(closest.element)
        return closest.element;
      }
      // 點到 task-item：切換選取狀態（並讓 icon-btn 出現）
      calendarContainer.addEventListener('click', (e) => {
        // 先阻止往 document 冒泡（放最前面，避免上方 return 直接跳走）
        // e.stopPropagation();

        // ✅ 1) 點到 header 任何地方：都算容器內，但不跑日期格邏輯
        if (e.target.closest(".calendar-header")) { return; }

        // 1) 先找日期格（不管點到哪個子元素）
        const cell = e.target.closest('li[data-tooltip]');
        if (!cell || !calendarContainer.contains(cell)) return;

        // ✅ 只有真的點到日期格，才阻止冒泡（避免 document 外部點擊收起）
        // 先阻止往 document 冒泡（放最前面，避免上方 return 直接跳走）
        e.stopPropagation();
        // 第一次點該格就建立 UI
        ensureTaskUI(cell);
        // console.log('trigger calendarContainer')

        // 2)🧹 清理該日期的空白任務（例如重新載入或點擊時）
        const dateKey = cell.getAttribute('data-tooltip');
        const arr = getList(dateKey);
        const before = arr.length;
        // 過濾掉 text 為空的任務
        dayTasks[dateKey] = arr.filter(x => x.text && x.text.trim() !== '');
        if (dayTasks[dateKey].length !== before) {
          persist(); renderTaskList(cell, dateKey);
        }
        // 3) 只在點到「cell 空白」時才切換 + 按鈕
        // const addBtn = cell.querySelector('.task-add-btn');
        // if (!addBtn) return;
        const add_edit_btn = cell.querySelector('.task-edit-btn');
        if (!add_edit_btn) return;

        const clickedRow     = !!e.target.closest('.task-item');      // 點到任務項目（.task-item）
        const clickedEditBtn  = !!e.target.closest('.task-edit-btn'); // 點到 + 按鈕本身
        const clickedList    = !!e.target.closest('.task-list');      // 點到清單容器（任務列表背景）
        const clickedIcon    = !!e.target.closest('.icon-btn');       // 點到刪除／拖曳等圖示
        // 在容器內非 task-list / task-item / + 按鈕 的點擊，一律取消選取
        if (!clickedRow && !clickedList && !clickedEditBtn) {
          selectedTaskId = null;
          calendarContainer.querySelectorAll('.task-item.selected')
            .forEach(el => el.classList.remove('selected'));
        }
        // 點到 + / 任務區（含清單與任務）/ 圖示 ==> 保持顯示
        if (clickedEditBtn || clickedList || clickedRow || clickedIcon) {
          // 可選：若想僅顯示單一格的 +，先關掉其他格的
          calendarContainer.querySelectorAll('.task-edit-btn.visible')
            .forEach(btn => { if (btn !== add_edit_btn) btn.classList.remove('visible'); });
          return;
        }
        calendarContainer.querySelectorAll('.task-edit-btn.visible')
          .forEach(btn => { if (btn !== add_edit_btn) btn.classList.remove('visible'); });
          add_edit_btn.classList.toggle('visible');
      });
      // === 取代你原本的 document 監聽器：只在「容器外」才清理 ===
      document.addEventListener('click', (e) => {
        if (calendarContainer.contains(e.target)) {   // ← 把這段復活
          console.log('trigger in calendarContainer'); return;
        }
        // console.log('trigger out of calendarContainer')
        // 容器外點擊：清除選取、收起所有 +
        selectedTaskId = null;
        calendarContainer.querySelectorAll('.task-item.selected')
          .forEach(el => el.classList.remove('selected'));
        calendarContainer.querySelectorAll('.task-edit-btn.visible')
          .forEach(btn => btn.classList.remove('visible'));
      });
