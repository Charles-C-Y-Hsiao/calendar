  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Monthly Calendar</title>
      <!--font awesome cdn-->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
      <!--flaticon cdn-->
      <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
      <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-chubby/css/uicons-regular-chubby.css">
      <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-straight/css/uicons-bold-straight.css">
      <!--css file-->
      <link rel="stylesheet" href="monthly-calendar.css" />
      <link rel="stylesheet" href="../shared/action-dialogs/module.css" />
      <link rel="stylesheet" href="monthly-task-list.css" />
      <link rel="stylesheet" href="monthly-day-panel.css" />
      <link rel="stylesheet" href="monthly-account.css" />

      <style>
        :root{
          --colW: 125px;
          --rowH: 102px;
          --gap:  1px;
        }
        * {
          font-family: "poppins", sans-serif;
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        body {
          min-height: calc(100vh - 10px);
          height: auto;
          max-height: none;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          padding: 5px 0;
        }
        .server-actions{
          /* margin-top:12px; */
          /* display:flex; */
          /* gap:8px; */
          /* flex-wrap:wrap; */
          position: absolute;
          left: 285px;
          min-width: 86px;
          display: flex;
          align-items: center;
        }
        .server-actions button{
          padding:8px 12px;
          border-radius:8px;
          border:1px solid #ddd;
          background:#fff;
          cursor:pointer;
        }
        .server-actions .danger{ color:#b00020; }
        .server-actions .muted{ color:#666; }
      </style>
    </head>
    <body>
      <div class="overall_calendars"><div id="calendars"></div></div>
      <!-- Server save-status UI (kept disabled). -->
      <!-- <div class="server-actions">
        <span id="save-status" class="status"></span>
      </div> -->
      <div class="user-dialog-overlay" id="user-dialog-overlay"></div>
      <div class="user-dialog">
        <div class="monthly-account-dialog">
          <div id="dialog-close">
            <a><div id="dialog-close-btn"><i class="fa-regular fa-circle-xmark"></i></div></a>
          </div>
          <div class="account-dialog-title">Account</div>
          <!-- <i class="fa-solid fa-xmark"></i> -->
            <div class="monthly-account-counter-row">
              <div id="counter">Entered 0 / 8 characters</div>
            </div>
          <div class="input-box">
            <input type="text" id="textInput" inputmode="numeric" maxlength="8" pattern="[0-9]{0,8}" required autocomplete="off">
            <label class="hint-wording">login-in name</label>
          </div>
          <div class="monthly-account-actions">
            <button type="button" class="secondary" id="clearUser"><span>Clear</span></button>
            <button type="button" class="btn btn-primary">Log-in</button>
          </div>
        </div>
      </div>
      <script>
        window.createMonthlyCalendarWebSocket = function (userId) {
          const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
          return new WebSocket(`${protocol}://${location.host}/?userId=${encodeURIComponent(userId)}`);
        };
      </script>
      <script src="monthly-account.js"></script>
      <script src="monthly-calendar-renderer.js"></script>
      <script src="monthly-persistence.js"></script>
      <script src="monthly-task-list.js"></script>
      <script src="monthly-day-panel.js"></script>
      <script src="../shared/action-dialogs/module.js"></script>

      <script src="monthly-account-adapter.js"></script>

    </body>
  </html>
