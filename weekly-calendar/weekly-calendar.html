  <!DOCTYPE html>
  <html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>Weekly Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Font Awesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-chubby/css/uicons-regular-chubby.css">

    <!-- interact.js -->
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

    <!-- dayjs date utility -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

    <link rel="stylesheet" href="weekly-calendar.css" />
    <link rel="stylesheet" href="../shared/action-dialogs/module.css" />
    <link rel="stylesheet" href="weekly-date-time-dialog.css" />
    <link rel="stylesheet" href="recurring-schedule.css" />
    <link rel="stylesheet" href="availability-schedule.css" />
    <link rel="stylesheet" href="weekly-account.css" />


    <style>
      :root{
        --hourHeight: 64px;    /* 每小時的顯示高度 */
        --slot: 30;            /* 每個時間區段的分鐘數；30 代表半小時 */
        --slotHeight: calc(var(--hourHeight) * var(--slot) / 60); /* 每個時間區段的高度 */
        --days: 7;
        --dayWidth: 140px;     /* 每日欄位寬度 */
        --headerH: 42px;       /* 日期標題列高度 */
        --rulerW: 70px;        /* 左側時間尺寬度 */
        --gap: 1px;
        --bg: #fff;
        --line: #e7e7ea;
        --accent: #4f46e5;
        --block: #eef2ff;
        --block-border: #c7d2fe;
        --block-text: #111827;
        --gray-deep:  #c7d2fe;  /* 深層邊框與醒目狀態 */
        --gray-mid:   #d9dbe9;  /* 一般邊框與 hover 狀態 */
        --gray-light: #ececf3;  /* 淺色分隔線 */
        --gray-soft:  #f5f5f8;  /* 柔和背景色 */
      }

      * { 
        box-sizing: border-box; 
        font-family: "calibri", sans-serif;
        /* font-family: ui-sans-serif, system-ui, "Segoe UI", 'PingFang TC', 'Microsoft JhengHei', Arial;  */
      }
      body {
        margin: 0; background: #f6f7fb; color: #222;
        display: grid; place-items: center;
        padding: 5px 24px;
        min-height: calc(100vh - 10px);
        height: auto;
        max-height: none;
        overflow: hidden;
        position: relative;
      }

    </style>
  </head>
  <body>
    <div class="board">
      <div class="weekbar">
        <nav class="mode-links" aria-label="Calendar view modes">
          <a href="/month/" class="mode-link month-link" id="monthModeLink">
            <i class="fa-regular fa-calendar-days"></i><span class="btn-word">month-mode</span>
          </a>
          <a href="/day/" class="mode-link day-link" id="dayModeLink">
            <i class="fi fi-rc-calendar-day"></i><span class="btn-word">day-mode</span>
          </a>
        </nav>
        <div class="server-actions">
          <span id="save-status" class="status">—</span>
        </div>
        <button class="btn-dir left"  id="btnPrevWeek" title="上一週"></button>
        <span class="range" id="weekRange"></span>
        <button class="btn-dir right" id="btnNextWeek" title="下一週"></button>
        <div class="weekbar-user-tools">
          <button type="button" class="bulk-schedule-btn invite-btn" title="Availability">
            <i class="fi fi-rr-invite-alt"></i>
          </button>
          <button type="button" class="bulk-schedule-btn" id="bulkScheduleBtn" title="管理週期項目">
            <i class="fi fi-rr-admin-alt"></i>
          </button>
          <a href="#" class="user_name_popup account-user-trigger" id ="show-user-name">
            <span class="btn-word">Hi, 00666888</span><i class="fa-regular fa-user"></i>
          </a>
        </div>
      </div>

      <div class="topbar" id="topbar">
        <div class="cell ruler">時間</div>
        <!-- 七天的日期標題由 JavaScript 產生 -->
      </div>

      <div class="content" id="content">
        <div class="ruler" id="ruler"></div>
        <!-- 七天的內容欄位由 JavaScript 產生 -->
      </div>
    </div>
    <div class="user-dialog-overlay" id="user-dialog-overlay"></div>
    <div class="user-dialog">
      <div class="weekly-account-dialog">
        <!-- <label for="textInput">請輸入 8 位數帳號</label> -->
        <div id="dialog-close">
            <a><div id="dialog-close-btn"><i class="fa-regular fa-circle-xmark"></i></div></a>
        </div>
        <div class="account-dialog-title">Account</div>
        <!-- <i class="fa-solid fa-xmark"></i> -->
          <div class="weekly-account-counter-row">
            <div id="counter">Entered 0 / 8 characters</div>
          </div>
        <div class="input-box">
          <input type="text" id="textInput" inputmode="numeric" maxlength="8" pattern="[0-9]{0,8}" required autocomplete="off">
          <label class="hint-wording">login-in name</label>
        </div>
        <div class="weekly-account-actions">
          <button type="button" class="secondary" id="clearUser"><span>Clear</span></button>
          <button type="button" class="btn btn-primary">Log-in</button>
        </div>
      </div>
    </div>
    <script src="weekly-account.js"></script>
    <script src="weekly-persistence.js"></script>
    <script src="weekly-navigation.js"></script>
    <script src="weekly-block-creation.js"></script>
    <script src="weekly-block-interaction.js"></script>
    <script src="weekly-date-time-dialog.js"></script>
    <script src="../shared/action-dialogs/module.js"></script>
    <script src="weekly-calendar-core.js"></script>
    <script src="availability-schedule.js"></script>
    <script src="recurring-schedule.js"></script>
    <script src="weekly-account-adapter.js"></script>
    <script>
  
      /* ===================== 基本設定 ===================== */
      // Demo 用法
      // function addBlock(setupInteract, { top, height, dayIndex }) {
      //   const block = createBlockElement({ top, height, dayIndex });
      //   dayCols[dayIndex].appendChild(block);
      //   setupInteract(block);
      //   updateBlockTime(block);
      //   return block;
      // }
      
      // 設定每週起始日：1 代表星期一，0 代表星期日。
      const WEEK_STARTS_ON = 1; // 1=Mon, 0=Sun

      // 取得指定日期所在週的起始日。
      function startOfWeek(date, weekStartsOn = WEEK_STARTS_ON){
        const d = new Date(date);
        const day = d.getDay();
        const diff = (day - weekStartsOn + 7) % 7; // 計算回推至每週起始日的天數。
        d.setDate(d.getDate() - diff);
        d.setHours(0,0,0,0);
        return d;
      }
      // 如需測試固定日期，可改用下方的 2025-11-02。
      // const currentRefDate = new Date('2025-11-02');
      const currentRefDate = new Date(); // 目前日期
      
      let viewStart = startOfWeek(currentRefDate, WEEK_STARTS_ON); // 當前顯示週的起始日
      // console.log({viewStart})

      function updateWeekRangeLabel(){
        const rangeEl = document.getElementById('weekRange');
        const from = fmtDate(viewStart);
        const to   = fmtDate(addDays(viewStart, 6));
        rangeEl.textContent = `${from} — ${to}`;
      }

      window.createWeeklyCalendarWebSocket = function (userId) {
        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        return new WebSocket(`${protocol}://${location.host}/?userId=${encodeURIComponent(userId)}`);
      };

      function connectCalendarWS(setupInteract) {
        const ws = window.createWeeklyCalendarWebSocket(user_name);

        ws.addEventListener('open', () => {
          console.log('[WS] connected (week view)');
        });

        ws.addEventListener('message', (ev) => {
          let msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            console.warn('[WS] parse error', e);
            return;
          }

          if (msg.type === 'calendar-init') {
            console.log('trigger calendar-init','viewStart',fmtDate(viewStart), msg.payload)
            // 初始載入完整的行事曆資料 map。
            allSchedules = msg.payload || {};
            renderWeekFromMap(viewStart, setupInteract, allSchedules, getDayCols);
            setStatus('已載入 ✓');
          } else if (msg.type === 'calendar-updated') {
            if (msg.sourceClientId && msg.sourceClientId === CALENDAR_CLIENT_ID) {
              console.log('[WS] skip own calendar-updated');
              return;
            }
            console.log('trigger calendar-updated','viewStart',fmtDate(viewStart),msg.payload)
            // 收到其他 client 的更新後，以最新資料 map 重新渲染本週。
            allSchedules = msg.payload || {};
            renderWeekFromMap(viewStart, setupInteract, allSchedules, getDayCols);
            setStatus('已同步 ✓');
          }
        });

        ws.addEventListener('close', () => {
          console.log('[WS] disconnected, retry in 3s...');
          setTimeout(() => connectCalendarWS(setupInteract), 3000);
        });

        ws.addEventListener('error', (e) => {
          console.error('[WS] error', e);
        });
      }

      document.addEventListener('DOMContentLoaded', async () => {
        // 設定上週與下週按鈕的 SVG。
        document.getElementById('btnPrevWeek').innerHTML = left_SVG;
        document.getElementById('btnNextWeek').innerHTML = right_SVG;
        
        // 依 viewStart 初始化日期標題列、時間尺與每日欄位。
        initTopbarRulerAndDays(viewStart);

        // 初始化行程區塊的拖曳與調整大小功能。
        const setupInteract = initInteractForBlocks({ slotPx, stepY, stepX, getDayCols });
        window.weeklyCalendarBulkContext = { setupInteract, getDayCols };
        initCreateGhostOrBlock(setupInteract); // 在每日欄位建立預覽或正式行程區塊。
        // 載入目前顯示週的資料。
        await loadWeek(viewStart, setupInteract, getDayCols);
        connectCalendarWS(setupInteract);
        initRecurringScheduleDialog({ setupInteract, getDayCols });

        updateWeekRangeLabel();
        // 預留鍵盤操作綁定。
        // bindKeyboardControls();

        // // demo block
        // addBlock(setupInteract, { top: slotPx * 6, height: slotPx * 3, dayIndex: 1 });

        // 綁定上週與下週切換按鈕。
        document.getElementById('btnPrevWeek').addEventListener('click', async () => {
          viewStart = addDays(viewStart, -7);
          initTopbarRulerAndDays(viewStart);
          const _setup = initInteractForBlocks({ slotPx, stepY, stepX, getDayCols });
          window.weeklyCalendarBulkContext = { setupInteract: _setup, getDayCols };
          initCreateGhostOrBlock(_setup);
          await loadWeek(viewStart, _setup, getDayCols);
          updateWeekRangeLabel();
        });
        document.getElementById('btnNextWeek').addEventListener('click', async () => {
          viewStart = addDays(viewStart, +7);
          initTopbarRulerAndDays(viewStart);
          const _setup = initInteractForBlocks({ slotPx, stepY, stepX, getDayCols });
          window.weeklyCalendarBulkContext = { setupInteract: _setup, getDayCols };
          initCreateGhostOrBlock(_setup);
          await loadWeek(viewStart, _setup, getDayCols);
          updateWeekRangeLabel();
        });
      });
    </script>
  </body>
  </html>
